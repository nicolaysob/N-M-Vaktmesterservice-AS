<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="Be om tilbud på fast kontrakt for borettslag, sameier eller næringsbygg hos N&amp;M Vaktmesterservice AS."
    />
    <meta property="og:title" content="Be om tilbud – fast kontrakt | N&amp;M Vaktmesterservice AS" />
    <meta
      property="og:description"
      content="Be om tilbud på fast kontrakt for borettslag, sameier eller næringsbygg hos N&amp;M Vaktmesterservice AS."
    />
    <meta property="og:type" content="website" />
    <link rel="canonical" id="canonical-link" href="" />
    <meta property="og:url" id="og-url" content="" />
    <meta property="og:image" content="https://nicolaysob.github.io/assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Be om tilbud – fast kontrakt | N&amp;M Vaktmesterservice AS" />
    <meta
      name="twitter:description"
      content="Be om tilbud på fast kontrakt for borettslag, sameier eller næringsbygg hos N&amp;M Vaktmesterservice AS."
    />
    <meta name="twitter:image" content="https://nicolaysob.github.io/assets/og-image.png" />
    <script>
      (function () {
        const REPO_PATH = '/N-M-Vaktmesterservice-AS';
        const isGitHubPages = window.location.hostname.endsWith('github.io');
        const basePath = isGitHubPages ? REPO_PATH : '';

        window.BASE_PATH = basePath;
        window.withBasePath = function withBasePath(path) {
          if (!path || /^(https?:|mailto:|tel:|data:|#)/.test(path)) {
            return path;
          }

          const normalizedPath = path.startsWith('/') ? path : `/${path.replace(/^\.?\/+/, '')}`;

          if (!basePath) {
            return normalizedPath;
          }

          if (normalizedPath.startsWith(`${REPO_PATH}/`) || normalizedPath === REPO_PATH) {
            return normalizedPath;
          }

          return `${basePath}${normalizedPath}`;
        };

        ['/css/base.css', '/css/layout.css', '/css/components.css'].forEach((href) => {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = window.withBasePath(href);
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body class="page-default">
    <div id="site-header"></div>

    <main>
      <section class="services" aria-labelledby="contact-contract-title">
        <div class="container contact-container">
          <h1 id="contact-contract-title">Be om tilbud – fast kontrakt</h1>
          <p>Skjemaet er merket som <strong>Fast kontrakt</strong>.</p>

          <form class="contact-form" action="https://formspree.io/f/mykdepdl" method="POST">
            <input type="hidden" name="inquiryType" value="Fast kontrakt" />

            <label for="contactPerson">Kontaktperson</label>
            <input id="contactPerson" name="contactPerson" type="text" required />

            <label for="company">Firma/borettslag/sameie</label>
            <input id="company" name="company" type="text" required />

            <label for="contactDetails">Telefon / e-post</label>
            <input id="contactDetails" name="contactDetails" type="text" required />

            <label for="location">Adresse / lokasjon</label>
            <input id="location" name="location" type="text" required />

            <label for="units">Antall enheter / omfang (valgfritt)</label>
            <input id="units" name="units" type="text" />

            <label for="description">Beskrivelse</label>
            <textarea id="description" name="description" rows="6" required></textarea>

            <label class="consent-field" for="consent">
              <input id="consent" name="consent" type="checkbox" value="ja" required />
              <span>
                Jeg samtykker til at N&amp;M Vaktmesterservice AS lagrer og behandler mine
                opplysninger for å kunne kontakte meg angående min henvendelse.
                <a href="/personvern/">Les personvernerklæringen</a>.
              </span>
            </label>

            <button class="button button-primary" type="submit">Be om tilbud (fast kontrakt)</button>
          </form>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script>
      (function () {
        const script = document.createElement('script');
        script.src = (window.withBasePath || ((path) => path))('/js/main.js');
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
