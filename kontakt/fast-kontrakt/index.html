  <body class="page-default">
    <div id="site-header"></div>

    <main>
      <section class="services" aria-labelledby="contact-contract-title">
        <div class="container contact-container">
          <h1 id="contact-contract-title">Be om tilbud – fast kontrakt</h1>
          <p>Skjemaet er merket som <strong>Fast kontrakt</strong>.</p>

          <form class="contact-form" action="https://formspree.io/f/mykdepdl" method="POST">
            <input type="hidden" name="inquiryType" value="Fast kontrakt" />

            <label for="contactPerson">Kontaktperson</label>
            <input id="contactPerson" name="contactPerson" type="text" required />

            <label for="company">Firma/borettslag/sameie</label>
            <input id="company" name="company" type="text" required />

            <label for="contactDetails">Telefon / e-post</label>
            <input id="contactDetails" name="contactDetails" type="text" required />

            <label for="location">Adresse / lokasjon</label>
            <input id="location" name="location" type="text" required />

            <label for="units">Antall enheter / omfang (valgfritt)</label>
            <input id="units" name="units" type="text" />

            <label for="description">Beskrivelse</label>
            <textarea id="description" name="description" rows="6" required></textarea>

            <label class="consent-field" for="consent">
              <input id="consent" name="consent" type="checkbox" value="ja" required />
              <span>
                Jeg samtykker til at N&amp;M Vaktmesterservice AS lagrer og behandler mine
                opplysninger for å kunne kontakte meg angående min henvendelse.
                <a href="../../personvern/">Les personvernerklæringen</a>.
              </span>
            </label>

            <button class="button button-primary" type="submit">Be om tilbud (fast kontrakt)</button>
          </form>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="../../js/main.js"></script>
  </body>
</html>
